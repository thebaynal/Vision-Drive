name: Desktop checks
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/check_submission.py
      - run: python -m compileall -q demo.py logic_demo.py visiondrive scripts
      - run: g++ -std=c++11 -Wall -Wextra -Werror tests/firmware_command_state.cpp -o /tmp/visiondrive-firmware-tests
      - run: /tmp/visiondrive-firmware-tests
