<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="730" viewBox="0 0 1280 730" role="img" aria-labelledby="title desc">
  <title id="title">VisionDrive ESP32 concept architecture</title>
  <desc id="desc">An illustrated camera image divided into left, middle, and right regions. An obstacle blocks the middle region. The decision pipeline detects, measures region overlap, and suggests a direction. This is a concept, not a measured result.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#102f3a"/></linearGradient>
    <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#203247"/><stop offset="1" stop-color="#152336"/></linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#68d8ca" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="730" rx="24" fill="url(#bg)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="54" y="62" fill="#68d8ca" font-size="15" letter-spacing="3">VISIONDRIVE / DESIGN CONCEPT</text>
    <text x="54" y="112" fill="#f8fafc" font-size="36" font-weight="700">See obstacles. Explain the next move.</text>
    <text x="54" y="146" fill="#becddd" font-size="19">Camera-only perception with a lightweight detector and explicit decision rules.</text>

    <rect x="54" y="188" width="704" height="424" rx="15" fill="#172538" stroke="#52647c"/>
    <path d="M55 358H757V597Q757 612 742 612H69Q54 612 54 597Z" fill="url(#floor)"/>
    <rect x="55" y="358" width="234" height="254" fill="#1e8b79" fill-opacity="0.11"/>
    <rect x="289" y="358" width="234" height="254" fill="#f59e0b" fill-opacity="0.13"/>
    <rect x="523" y="358" width="234" height="254" fill="#1e8b79" fill-opacity="0.11"/>
    <path d="M289 189V611M523 189V611" stroke="#a9b9cd" stroke-width="2" stroke-dasharray="9 8"/>
    <path d="M55 358H757" stroke="#74899f" stroke-dasharray="5 7"/>
    <text x="172" y="228" text-anchor="middle" fill="#9de7d9" font-size="18" font-weight="700">LEFT</text>
    <text x="406" y="228" text-anchor="middle" fill="#f8d18b" font-size="18" font-weight="700">MIDDLE</text>
    <text x="640" y="228" text-anchor="middle" fill="#9de7d9" font-size="18" font-weight="700">RIGHT</text>

    <path d="M358 392L406 369L462 395V484L407 511L358 484Z" fill="#b58b65"/>
    <path d="M358 392L407 417L462 395M407 417V511" fill="none" stroke="#66503d" stroke-width="3"/>
    <rect x="340" y="350" width="140" height="174" rx="6" fill="none" stroke="#f6c367" stroke-width="3"/>
    <rect x="340" y="320" width="140" height="28" rx="4" fill="#f6c367"/>
    <text x="351" y="340" fill="#182336" font-size="15" font-weight="700">OBSTACLE</text>

    <rect x="55" y="527" width="702" height="84" rx="0" fill="#df5965" fill-opacity="0.10"/>
    <path d="M55 527H757" stroke="#f0919c" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="76" y="555" fill="#f9bac1" font-size="15">NEAR AREA / IMAGE-BASED STOP HEURISTIC</text>
    <text x="76" y="587" fill="#b8c8da" font-size="14">Overlay drawn after inference. Image position is not distance.</text>

    <rect x="800" y="188" width="426" height="94" rx="13" fill="#182d3c" stroke="#3c596c"/>
    <text x="822" y="221" fill="#68d8ca" font-size="14" letter-spacing="2">01 / DETECT</text>
    <text x="822" y="255" fill="#f1f5f9" font-size="21" font-weight="600">ESPDet-Pico → obstacle boxes</text>
    <path d="M1013 289V307" stroke="#68d8ca" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="800" y="319" width="426" height="94" rx="13" fill="#182d3c" stroke="#3c596c"/>
    <text x="822" y="352" fill="#68d8ca" font-size="14" letter-spacing="2">02 / INTERPRET</text>
    <text x="822" y="386" fill="#f1f5f9" font-size="21" font-weight="600">Measure overlap in three regions</text>
    <path d="M1013 420V438" stroke="#68d8ca" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="800" y="450" width="426" height="162" rx="13" fill="#103f3e" stroke="#56cbbb" stroke-width="2"/>
    <text x="822" y="483" fill="#91f0dd" font-size="14" letter-spacing="2">03 / SUGGEST</text>
    <text x="822" y="525" fill="#e6fff8" font-size="28" font-weight="700">LEFT SUGGESTED</text>
    <text x="822" y="558" fill="#c0e3dd" font-size="17">Middle blocked; side tie selects left.</text>
    <text x="822" y="588" fill="#c0e3dd" font-size="15">A suggestion does not verify clearance.</text>

    <text x="54" y="658" fill="#e6edf6" font-size="18">Desktop demo first</text>
    <text x="54" y="686" fill="#aabfd0" font-size="16">Webcam or video → visual instructions → future ESP32-S3 motor integration</text>
    <text x="1226" y="681" text-anchor="end" fill="#83a2b4" font-size="14">ILLUSTRATION · NOT A LIVE RESULT</text>
  </g>
</svg>
